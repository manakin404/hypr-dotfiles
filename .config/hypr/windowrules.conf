##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Fix some weird transparent blur around shadows in some context menus under xwayland
windowrule = no_blur on, match:xwayland 1, match:float 1


##################
## CUSTOM RULES ##
##################


# Set opacity for specific apps
windowrule = opaque on, opacity 1.0 1.0, match:class ^(mpv)$ # practically "disables" opacity outright
windowrule = opacity 0.94 0.94, match:class ^(Spotify)$
windowrule = opaque on, opacity 1.0 1.0, match:class ^(firefox)$ # same as mpv

# window rules for kitty
# windowrule = opacity 0.9 0.8, class:^(kitty)
layerrule = blur on, match:namespace class:^(kitty)$
windowrule = xray on, match:class ^(kitty)$
# windowrulev2 = animation popin 95%, class:kitty

# waybar
layerrule = blur on, match:namespace class:^(waybar)$

# set swayimg to always float
windowrule = float on, match:class swayimg



# Custom apps
windowrule = opaque on, opacity 1.0 1.0, match:class steam_app_0, match:title HoYoPlay

# Fixes context menus losing focus while using jetbrain ide apps
# fix tooltips (always have a title of `win.<id>`)
windowrule = no_initial_focus on, no_focus on, match:class ^(.*jetbrains.*)$, match:title ^(win.*)$
# fix tab dragging (always have a single space character as their title)
windowrule = no_initial_focus on, no_focus on, match:class ^(.*jetbrains.*)$, match:title ^\\s$

# Fix winboat taking focus
windowrule = no_focus on, match:class ^(*xfreerdp*)$, match:title ^(FreeRDP*)$

# borderless desktop gremlin
windowrule = no_blur on, no_shadow on, border_size 0, match:title ilgwg_desktop_gremlins.py


# Gaming 
windowrule = workspace 3, match:class ^(steam)$


# blur
layerrule = blur on, ignore_alpha 0, match:namespace vicinae


# Linux desktop gremlin windowrule

windowrule {
    name = linux-gremlin
    no_blur = on
    no_shadow = on
    border_size = 0
    match:title = ilgwg_desktop_gremlins.py
}