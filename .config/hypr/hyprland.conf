
# ####################################### #
# Manakin's Hyprland Configuration files  #
# ####################################### #

autogenerated = 0 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf
source = ~/.cache/wal/colors-hyprland.conf



################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-2,1920x1080@360,auto,1.0,bitdepth,10
# monitor=eDP-1,1920x1200@165,auto,1.0,bitdepth,10
monitor=eDP-1, disable
#monitor=,highrr,auto,auto,bitdepth,10
#monitor=HDMI-A-1,1920x1060@170,0x0,auto,bitdepth,10
# monitor=HDMI-A-1,3840x2160@60,auto,1.0,bitdepth,10


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Programs
$terminal = kitty
$fileManager = thunar
$menu = wofi --show=drun --allow-images
$fuzzel = fuzzel
$prompt = wlogout
$lock = hyprlock

####################
### MY SHORTCUTS ###
####################

### SCREENSHOT & CLIPBOARD ###
$regionscreenshot = hyprshot -m region -o ~/Pictures/hyprshots
$fullscreenshot = hyprshot -m output -m active
$windowscreenshot = hyprshot -m window
$clip = cliphist list | wofi --dmenu | cliphist decode | wl-copy


### WALLPAPER SHORTCUTS ###
# Wallpaper shortcut using waypaper
$waywall = waypaper --random --folder "$HOME/wallpaper" --backend swww --fill fill
# Wallpaper randomizer script on launch
$wallscript = ~/hypr-dotfiles/.config/scripts/swww_script.sh random
# wallpaper randomizer via shell
$wallcommand = fish -c "swww img (find ~/wallpaper -type f | shuf -n 1) --transition-type outer --transition-duration 2.3 --transition-fps 60 --transition-pos 0.877,1.0"
$pywalrandom = ~/hypr-dotfiles/.config/scripts/hyprstyle
$defaultwall = swww img wallpaper/castorice-purple-7680x4320-22219.jpg --transition-type outer --transition-duration 1 | wal -i wallpaper/castorice-purple-7680x4320-22219.jpg


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = swww-daemon & udiskie & hyprpm reload -n & swaync & blueman-applet & nm-applet
exec-once = sleep 1 && waybar
exec-once = wal -R -n
exec-once = ~/hypr-dotfiles/.config/scripts/battery.sh
exec-once = asusctl profile -P performance & cliphist wipe & wl-paste --watch cliphist store
exec-once = hyprpolkitagent & fcitx5
exec-once = sunsetr & mpd
exec-once = otd-daemon

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env= XCURSOR_THEME, Adwaita
env = XCURSOR_SIZE, 24
env= HYPRCURSOR_THEME, BibataModernClassic
env = HYPRCURSOR_SIZE, 24
env = GBM_BACKEND,nvidia-drm
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GTK_IM_MODULE=fcitx
env = QT_IM_MODULE=fcitx
env = XMODIFIERS=@im=fcitx
env = HYPRSHOT_DIR,$HOME/Pictures
env = SDL_VIDEODRIVER=wayland, osu-wine
env = SDL_VIDEODRIVER=x11, firefox

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # Default
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)

    # Misc. colors
    col.active_border = $color6 $color8
    col.inactive_border = $color13






    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.169
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 2
 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    enable_anr_dialog = false
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout =
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
#    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Cursor configuration
cursor {
    no_hardware_cursors = true
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, forcekillactive,
bind = $mainMod, W, killactive
# bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $fuzzel
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Advanced binds
bind = $mainMod, L, exec, $lock
bind = $mainMod, N, exec, $prompt
bind = $mainMod, B, exec, $regionscreenshot
bind = $mainMod, Z, exec, $pywalrandom
bind = $mainMod, X, exec, $clip
bind = ALT, F, fullscreen
bind = CTRL, Tab, workspace, e+1 # fun alt tab trick
bind = ALT, O, exec, hyprfreeze -a
bind = ALT, L, exec, $defaultwall
bind = ALT, B, exec, $fullscreenshot
bind = ALT, N, exec, $windowscreenshot
bind = ALT, R, exec, /usr/bin/ames -r

# Fix for OBS Studio Global Shortcuts
bind = SHIFT, F1, pass, class:^(com.obsproject.Studio)$
bind = SHIFT, F2, pass, class:^(com.obsproject.Studio)$
bind = SHIFT, F4, pass, class:^(com.obsproject.Studio)$
bind = SHIFT, F5, pass, class:^(com.obsproject.Studio)$


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bind = ALT, D, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bind = ALT, A, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#############
## SUBMAPS ##
#############
bind = $mainMod, A, submap, resize
submap = resize
    # Arrow key window resizing 
    bind = CTRL, left, resizeactive, -10 0
    bind = CTRL, right, resizeactive, 10 0
    bind = CTRL, up, resizeactive, 0 -10
    bind = CTRL, down, resizeactive, 0 10
    bind = , escape, submap, reset
submap = reset

########################
### HYPRLAND PLUGINS ###
########################

# can be: toggle, off/disable or on/enable
bind = SUPER, TAB, hyprexpo:expo, toggle # change binds to your liking
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = true # laptop touchpad
        gesture_fingers = 3  # 3 or 4
        gesture_distance = 100 # how far is the "max"
        gesture_positive = true # positive = swipe down. Negative = swipe up.
    }
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Set opacity for specific apps
windowrulev2 = opaque, opacity 1.0 1.0, class:^(mpv)$ # practically "disables" opacity outright
windowrulev2 = opacity 0.94 0.94,class:^(Spotify)$ 
windowrulev2 = xray, class:^(kitty)$
windowrulev2 = opaque, opacity 1.0 1.0, class:^(firefox)$ # same as mpv

# Fix some weird transparent blur around shadows in some context menus under xwayland
windowrule = noblur, xwayland:1, floating:1

# set swayimg to always float
windowrulev2 = float, class: swayimg

# Custom apps
windowrulev2 = opaque, opacity 1.0 1.0, class:steam_app_0, title:HoYoPlay,

# Fixes context menus losing focus while using jetbrain ide apps

# fix tooltips (always have a title of `win.<id>`)
windowrulev2 = noinitialfocus, class:^(.*jetbrains.*)$, title:^(win.*)$
windowrulev2 = nofocus, class:^(.*jetbrains.*)$, title:^(win.*)$
# fix tab dragging (always have a single space character as their title)
windowrulev2 = noinitialfocus, class:^(.*jetbrains.*)$, title:^\\s$
windowrulev2 = nofocus, class:^(.*jetbrains.*)$, title:^\\s$